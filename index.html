<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boba Bāka bubble tea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one pinned stage where a single cup tumbles through five colour worlds as you scroll; plain sections follow. Single theme by choice. */
:root{
  --ink:#1B1210;
  --cream:#FFF4E4;
  --pink:#FF4F86;
  --pearl:#2A1710;
  --sun:#FFB800;
  --bg:#FF4F86;      /* animated by script */
  --fg:#FFF4E4;      /* animated by script */
  --liq:#FFC9D6;     /* animated by script */
  --liq2:#FF9DB6;    /* animated by script */
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(16px,4vw,48px);color:var(--navfg,#FFF4E4);transition:background .3s}
.nav.solid{background:var(--cream);color:var(--ink);border-bottom:2px solid var(--ink)}
.logo{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.nav-links{display:flex;gap:28px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.nav-links a{text-decoration:none}
.nav-links a:hover{text-decoration:underline;text-underline-offset:6px}
.lang{display:flex;gap:2px}
.lang button{background:none;border:2px solid transparent;border-radius:999px;padding:8px 11px;min-height:40px;font-weight:700;font-size:13px;letter-spacing:.05em}
.lang button[aria-pressed="true"]{border-color:currentColor}
@media (max-width:820px){.nav-links{display:none}}

/* stage */
.stage{height:520vh;position:relative;background:var(--bg)}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--bg);color:var(--fg)}
.pearl{position:absolute;border-radius:50%;background:var(--pearl);box-shadow:inset -6px -6px 0 rgba(255,255,255,.08),inset 5px 5px 0 rgba(255,255,255,.14);will-change:transform}
.cup-wrap{position:absolute;left:50%;top:52%;width:0;height:0;z-index:2;will-change:transform}
.cup{position:absolute;height:min(56svh,520px);aspect-ratio:260/440;left:0;top:0;transform:translate(-50%,-50%);filter:drop-shadow(0 30px 30px rgba(0,0,0,.25))}
.scene{position:absolute;inset:0;padding:84px clamp(16px,4vw,48px) clamp(20px,4vh,44px);display:flex;flex-direction:column;justify-content:space-between;gap:16px;pointer-events:none;will-change:opacity,transform}
.scene.on{pointer-events:auto}
.scene>*{position:relative}
.scene .top{z-index:3}
.scene .bottom{z-index:3}
.ghost{position:absolute;left:0;top:50%;z-index:1;font-family:var(--display);font-weight:900;font-size:34vw;line-height:.8;white-space:nowrap;opacity:.13;transform:translateY(-50%);will-change:transform;pointer-events:none}
.hero-h{font-family:var(--display);font-weight:900;font-size:clamp(44px,9.4vw,150px);line-height:.92;letter-spacing:-.04em;text-transform:uppercase}
.hero-b{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.hero-b p{max-width:30ch;font-weight:500;font-size:clamp(16px,1.5vw,20px)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:2px solid currentColor;background:none;font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn.solid{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.num{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.1em;margin-bottom:10px}
.fl-h{font-family:var(--display);font-weight:900;font-size:clamp(38px,8.4vw,128px);line-height:.92;letter-spacing:-.04em;text-transform:uppercase;max-width:9ch}
.fl-b{display:flex;flex-direction:column;gap:14px;max-width:400px}
.fl-b p{font-weight:500}
.fl-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.price{font-family:var(--display);font-weight:900;font-size:clamp(28px,3.4vw,44px);font-variant-numeric:tabular-nums}
.tag{border:2px solid currentColor;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.dots{position:absolute;right:clamp(12px,2.4vw,32px);top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:10px}
.dots i{width:8px;height:8px;border-radius:50%;border:2px solid var(--fg);transition:height .3s,background .3s}
.dots i.on{background:var(--fg);height:26px;border-radius:8px}

/* marquee */
.marq{background:var(--ink);color:var(--cream);overflow:hidden;padding:18px 0;font-family:var(--display);font-weight:700;font-size:clamp(18px,3vw,34px);text-transform:uppercase;white-space:nowrap}
.marq div{display:inline-block;animation:slide 26s linear infinite}
.marq span{margin:0 22px}
.marq b{color:var(--sun);font-weight:700}
@keyframes slide{to{transform:translateX(-50%)}}

/* sections */
.sec{padding:clamp(64px,10vw,140px) clamp(16px,4vw,48px)}
.wrap{max-width:1240px;margin:0 auto}
.eyebrow{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.h2{font-family:var(--display);font-weight:900;font-size:clamp(36px,7vw,104px);line-height:.95;letter-spacing:-.04em;text-transform:uppercase;text-wrap:balance}
.menu-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:36px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{min-height:46px;padding:0 20px;border-radius:999px;border:2px solid var(--ink);background:none;font-weight:700;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.item{display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:190px;padding:22px;border-radius:26px;background:#fff;border:2px solid var(--ink);transition:transform .25s,box-shadow .25s}
.item:hover{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--ink)}
.item h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.02em}
.item p{font-size:15px;margin-top:8px;color:#5a4a44}
.item .foot{display:flex;align-items:center;justify-content:space-between}
.item .foot b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink)}
.note{margin-top:22px;font-size:14px;color:#5a4a44}

.how{background:var(--ink);color:var(--cream)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:44px}
.step{padding:26px;border-radius:26px;border:2px solid rgba(255,244,228,.3);display:flex;flex-direction:column;gap:14px}
.step b{font-family:var(--display);font-weight:900;font-size:64px;line-height:1;color:var(--sun)}
.step h3{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
.step p{color:#e2d3c2}

.visit{background:var(--sun)}
.visit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:44px}
.card{padding:26px;border-radius:26px;background:var(--cream);border:2px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.card h3{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.card p{overflow-wrap:anywhere}
.card .big{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,26px);line-height:1.2}
.hours{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-weight:500;font-variant-numeric:tabular-nums}
.open{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.open::before{content:"";width:10px;height:10px;border-radius:50%;background:#1f9d55}
.open.closed::before{background:#c0392b}
.card .btn{align-self:flex-start;margin-top:auto}

.foot-sec{background:var(--pink);color:var(--cream);padding:clamp(48px,8vw,100px) clamp(16px,4vw,48px) 28px;overflow:hidden}
.foot-big{font-family:var(--display);font-weight:900;font-size:clamp(52px,17vw,280px);line-height:.85;letter-spacing:-.05em;text-transform:uppercase;white-space:nowrap}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:36px;font-size:14px;font-weight:500}

@media (max-width:820px){
  .hero-h{font-size:clamp(40px,12.4vw,90px)}
  .cup{height:min(42svh,380px)}
  .cup-wrap{top:50%}
  .hero-b p{max-width:none}
  .dots{display:none}
  .fl-b{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .marq div{animation:none}
  .btn,.item{transition:none}
}
</style>
</head>

let lang="lv",tab=0;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function renderMenu(){
  const o={lv:3,ru:5,en:7}[lang];
  $("#tabs").innerHTML=T[lang].tabs.map((t,i)=>`<button type="button" role="tab" aria-selected="${i===tab}" data-tab="${i}">${t}</button>`).join("");
  $("#items").innerHTML=MENU.filter(m=>m[0]===tab).map(m=>`<article class="item"><div><h3>${m[o]}</h3><p>${m[o+1]}</p></div><div class="foot"><b>€${m[1]}</b><span class="swatch" style="background:${m[2]}"></span></div></article>`).join("");
}
function isOpen(){
  try{
    const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Riga",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value, wd=g("weekday"), h=+g("hour")+ +g("minute")/60;
    return (wd==="Sat"||wd==="Sun")?(h>=10&&h<22):(h>=9&&h<21);
  }catch(e){return true}
}
function apply(){
  document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>{el.innerHTML=T[lang][el.dataset.i]});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const m=T[lang].marq.map(x=>`<span>${x}</span><b>●</b>`).join("");
  $("#marq").innerHTML=m+m+m+m;
  const op=isOpen(),el=$("#open");
  el.textContent=T[lang][op?"open":"closed"];el.classList.toggle("closed",!op);
  renderMenu();
}
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;apply()}));
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=+b.dataset.tab;renderMenu()}});

/* scroll stage */
const S=[ /* bg, fg, liquid top, liquid bottom */
 ["#FF4F86","#FFF4E4","#FFE3EA","#FFB3C6"],
 ["#6B4DFF","#FFF4E4","#E2D8FF","#B9A4FF"],
 ["#1F7A4D","#FFF4E4","#DDF0B6","#A9D46E"],
 ["#FFB800","#1B1210","#FFF0B0","#FF9F2E"],
 ["#3A1F14","#FFF4E4","#EBCFAE","#B9773F"]
];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=hex(a),y=hex(b);return"rgb("+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(",")+")"};
const stage=$(".stage"),pin=$(".pin"),cupWrap=$("#cupWrap"),scenes=$$(".scene"),pearls=$$(".pearl"),dots=$$(".dots i");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const N=S.length,nav=$(".nav");
function frame(){
  const r=stage.getBoundingClientRect(),vh=window.innerHeight;
  const p=Math.min(1,Math.max(0,-r.top/(r.height-vh)));
  const f=p*(N-1),i=Math.min(N-2,Math.floor(f)),t=f-i;
  let e=Math.min(1,Math.max(0,(t-.3)/.4));e=e*e*(3-2*e);
  const g=i+e;                      /* eased position: holds on each flavor */
  const st=pin.style;
  st.setProperty("--bg",mix(S[i][0],S[i+1][0],e));
  st.setProperty("--fg",mix(S[i][1],S[i+1][1],e));
  st.setProperty("--liq",mix(S[i][2],S[i+1][2],e));
  st.setProperty("--liq2",mix(S[i][3],S[i+1][3],e));
  stage.style.setProperty("--bg",mix(S[i][0],S[i+1][0],e));
  const wide=window.innerWidth>820;
  const shift=wide?window.innerWidth*.22:0;
  const past=r.bottom<60;nav.classList.toggle("solid",past);nav.style.setProperty("--navfg",mix(S[i][1],S[i+1][1],e));
  const rot=reduce?0:g*360, sc=1-.16*Math.sin(e*Math.PI);
  cupWrap.style.transform=`translateX(${shift}px) rotate(${rot}deg) scale(${sc})`;
  scenes.forEach((s,k)=>{
    const d=g-k,o=Math.max(0,1-Math.abs(d)*2.4);
    s.style.opacity=o;s.style.visibility=o<.01?"hidden":"visible";
    s.style.transform=reduce?"":`translateY(${-d*70}px)`;
    s.classList.toggle("on",o>.6);
    const gh=s.querySelector(".ghost");
    gh.style.transform=`translate(${(-(f-k)*38-4)}vw,-50%)`;
  });
  if(!reduce)pearls.forEach(b=>{b.style.transform=`translateY(${-p*b.dataset.s}px)`});
  const near=Math.round(g);dots.forEach((d,k)=>d.classList.toggle("on",k===near));
}
let tick=false;
function onScroll(){if(!tick){tick=true;requestAnimationFrame(()=>{frame();tick=false})}}
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);
frame();
